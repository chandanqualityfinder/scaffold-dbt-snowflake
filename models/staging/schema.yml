version: 2

models:
  - name: stg_table1
    columns:
      - name: pkid
        data_tests:
          - not_null
          - unique
      - name: num1
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn  
              

  - name: stg_table2
    columns:
      - name: pkid
        data_tests:
          - not_null
          - unique
      - name: date1
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2000-01-01'"
                max_value: "current_date()"
              config:
                severity: warn